<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중1 정보 수업 자료</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#1d2433;--muted:#5b6478;--line:#dde2ec;--brand:#2f5bea;--brand-soft:#e6ecff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.6}
main{max-width:860px;margin:0 auto;padding:40px 16px}
h1{margin:0 0 4px;font-size:1.8rem}
p.sub{color:var(--muted);margin:0 0 28px}
.list{display:grid;gap:12px}
a.item,div.item{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px;color:inherit;text-decoration:none}
a.item:hover{border-color:var(--brand)}
.no{flex:0 0 44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);font-weight:800;display:flex;align-items:center;justify-content:center}
.item b{display:block;font-size:1.05rem}
.item span{color:var(--muted);font-size:.9rem}
div.item{opacity:.55}
.soon{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<main>
  <h1>중학교 1학년 정보 수업 자료</h1>
  <p class="sub">한 차시(45분) 분량의 인터랙티브 수업 페이지 모음 · 2022 개정 교육과정</p>
  <div class="list">
    <a class="item" href="01-binary/"><div class="no">01</div><div><b>0과 1로 세상 표현하기</b><span>데이터 · 비트와 바이트, 이진수 카드, 픽셀 그림, 문자 코드</span></div></a>
    <div class="item"><div class="no">02</div><div><b>업다운 게임으로 배우는 탐색 알고리즘</b><span>알고리즘과 프로그래밍</span></div><span class="soon">준비 중</span></div>
    <div class="item"><div class="no">03</div><div><b>AI는 어떻게 구분할까?</b><span>인공지능 · 분류 모델 체험</span></div><span class="soon">준비 중</span></div>
    <div class="item"><div class="no">04</div><div><b>내 정보 지키기</b><span>디지털 문화 · 개인정보와 안전한 비밀번호</span></div><span class="soon">준비 중</span></div>
    <div class="item"><div class="no">05</div><div><b>컴퓨터의 구성 요소</b><span>컴퓨팅 시스템 · 입력, 처리, 출력, 저장</span></div><span class="soon">준비 중</span></div>
  </div>
</main>
</body>
</html>
