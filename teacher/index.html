<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사용 관리</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/common.css">
<style>
body{padding-bottom:40px}
.t-top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--line)}
.t-top .in{max-width:1200px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.t-top h1{font-size:1.15rem;margin:0 8px 0 0}
.t-top select{font:inherit;font-weight:700;padding:6px 10px;border:2px solid var(--brand);border-radius:12px;color:var(--brand);background:#fff}
.t-top .sp{flex:1}
.t-top .who{font-size:.85rem;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;max-width:1200px;margin:0 auto;padding:6px 16px 10px}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.tabs button.on{border-color:var(--brand);background:var(--brand);color:#fff}
main{max-width:1200px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:5px 12px;font:inherit;cursor:pointer;color:var(--ink)}
.seg button.on{border-color:var(--mint);background:var(--mint-soft);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.acts{display:grid;gap:6px}
.act{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px 12px;background:#fff}
.act.open{border-color:var(--mint);background:var(--mint-soft)}
.act .nm{flex:1;min-width:0}
.act .nm small{color:var(--muted);display:block;font-size:.8rem}
.sw{position:relative;width:52px;height:30px;flex:none;border:0;border-radius:999px;background:#cfd6e4;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--mint)}
.sw.on::after{left:26px}
.pin-btn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 8px;font:inherit;font-size:.85rem;cursor:pointer;flex:none}
.pin-btn.on{border-color:#f0c040;background:var(--yellow-soft)}
.scroll-x{overflow-x:auto}
table.t{border-collapse:collapse;font-size:.88rem;min-width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
table.t th{background:var(--bg);position:sticky;top:0}
table.t td.l,table.t th.l{text-align:left}
table.t th.click,table.t td.click{cursor:pointer;color:var(--brand);text-decoration:underline}
td.done{background:var(--mint-soft)}
td.part{background:var(--yellow-soft)}
td.skip{background:#f1f1f4;color:var(--muted)}
td.no{color:#c33;font-weight:700}
td.ok{color:#0d7d71;font-weight:700}
.big-code{font-family:ui-monospace,Consolas,monospace;font-size:3.4rem;font-weight:800;letter-spacing:.2em;color:var(--brand)}
.att-box{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--brand-soft);border-radius:16px;padding:12px 18px;margin:8px 0}
.panel{border:2px solid var(--brand);border-radius:16px;padding:14px;margin-top:12px;background:#fff}
.panel h3{margin-top:0}
textarea.in,input.in,select.in{font:inherit;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea.in{width:100%;box-sizing:border-box}
.note{border-bottom:1px dashed var(--line);padding:6px 0;font-size:.92rem}
.note small{color:var(--muted)}
.mini{font-size:.8rem;color:var(--muted)}
.bar{display:inline-block;height:10px;background:var(--pink);border-radius:5px;vertical-align:middle}
.danger{background:#e5484d;box-shadow:0 3px 0 #b3262b}
.over{position:fixed;inset:0;z-index:100;background:rgba(15,20,35,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;padding:16px}
.over .big-code{color:#fff;font-size:min(22vw,9rem)}
@media print{.t-top,.tabs,.noprint{display:none!important}}
</style>
</head>
<body>
<div class="t-top"><div class="in">
  <h1>👩‍🏫 교사용 관리</h1>
  <select id="cls" title="반 선택" hidden></select>
  <span class="sp"></span>
  <a class="btn line" href="../index.html" style="padding:6px 12px">체험관 ↗</a>
  <span class="who" id="who"></span>
</div></div>
<nav class="tabs" id="tabs" hidden>
  <button data-t="open">🔓 열기·잠금</button>
  <button data-t="attend">✋ 출석·접속</button>
  <button data-t="prog">📊 진도표</button>
  <button data-t="notes">📝 누가기록</button>
  <button data-t="roster">👥 명단·코드</button>
  <button data-t="data">💾 내보내기·정리</button>
</nav>
<main id="view"><div class="card"><p class="hint">불러오는 중…</p></div></main>
<script src="../assets/contents.js"></script>
<script src="teacher.js"></script>
</body>
</html>
